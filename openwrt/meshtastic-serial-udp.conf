# Configuration for meshtastic-serial-udp
# This file is sourced by the init script.

# Serial port of the Meshtastic radio. "auto" tries /dev/serial/by-id/*,
# then /dev/ttyACM*, then /dev/ttyUSB*, and uses the first port that
# answers the Meshtastic handshake. To always use one port, set its path,
# e.g. PORT=/dev/ttyACM1
PORT=auto

# Serial baud rate
BAUD=115200

# UDP multicast address
UDP_ADDR=224.0.0.69

# UDP multicast port
UDP_PORT=4403

# Network interface IP to bind multicast socket to
INTERFACE=127.0.0.1
